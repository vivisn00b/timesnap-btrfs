# Package: 
#   timesnap-btrfs
#
# Purpose:
#   Configuration file for timesnap-autosnapshot, which creates automatic Timeshift snapshots
#   before system upgrades via pacman.
#   This config file allows you to customize snapshot behavior, retention, and GRUB updates.
#
#   Use this with the `timesnap` package and pacman hooks to ensure system restore points
#   are created reliably before risky system changes.
